<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E4FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plataforma Vamos">
<title>Plataforma Vamos · Mock</title>
<style>
:root{
  --blue:#1E4FA0; --blue-d:#163B78; --blue-l:#E6EDF8;
  --yellow:#F5C400; --yellow-l:#FFF6CC;
  --ink:#1F2937; --muted:#6B7280; --line:#E5E7EB; --bg:#F4F6FA; --card:#FFFFFF;
  --ok:#2E7D32; --ok-l:#E8F3E9; --mid:#C98A00; --mid-l:#FFF3D6; --bad:#C62828; --bad-l:#FDECEC;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#DCE3EE;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
#phone{max-width:430px;margin:0 auto;height:100vh;height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){
  body{padding:24px 0}
  #phone{min-height:860px;height:860px;border-radius:36px;box-shadow:0 20px 60px rgba(15,35,80,.25);border:10px solid #111827}
}
/* header */
.hdr{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);color:#fff;padding:14px 16px 16px;position:relative;flex-shrink:0}
.hdr:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--yellow)}
.hdr-top{display:flex;align-items:center;gap:10px}
.hdr .back{background:rgba(255,255,255,.15);border:0;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.hdr h1{font-size:18px;margin:0;flex:1;font-weight:700;letter-spacing:-.2px}
.role-chip{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:6px 10px;font-size:12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.role-chip i{width:8px;height:8px;border-radius:50%;background:var(--yellow);display:inline-block}
.hdr .sub{font-size:13px;opacity:.85;margin-top:4px}
/* content */
main{flex:1;overflow-y:auto;padding:16px 16px 96px}
.sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.sec a{color:var(--blue);text-transform:none;letter-spacing:0;font-size:13px;cursor:pointer}
.card{background:var(--card);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.06);margin-bottom:10px}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.985)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.title{font-weight:650;font-size:15px}
.meta{font-size:13px;color:var(--muted)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.kpi b{display:block;font-size:24px;letter-spacing:-.5px}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.accent{background:var(--blue);color:#fff}.kpi.accent span{color:rgba(255,255,255,.8)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:650;border-radius:999px;padding:3px 9px;white-space:nowrap}
.b-ok{background:var(--ok-l);color:var(--ok)}.b-mid{background:var(--mid-l);color:var(--mid)}.b-bad{background:var(--bad-l);color:var(--bad)}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-grey{background:#EEF0F3;color:#4B5563}.b-yel{background:var(--yellow-l);color:#7A5B00}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.d-ok{background:var(--ok)}.d-mid{background:var(--yellow)}.d-bad{background:var(--bad)}
.bar{height:8px;border-radius:99px;background:#E9EDF3;overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.bar .f{background:var(--blue)}
.s-ok{background:var(--ok)}.s-mid{background:var(--yellow)}.s-bad{background:#E57373}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--blue-l);color:var(--blue);display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:14px}
.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:650;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-p{background:var(--blue);color:#fff}.btn-y{background:var(--yellow);color:#1F2937}
.btn-o{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn-g{background:#EEF0F3;color:var(--ink)}
.btn-sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btns{display:grid;gap:8px;margin-top:12px}
.btns.two{grid-template-columns:1fr 1fr}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 2px 6px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px;outline:none}
.inp:focus{border-color:var(--blue)}
textarea.inp{min-height:90px;resize:vertical}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%)}
.list>.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list>.li:last-child{border-bottom:0}
.li.tap{cursor:pointer}
.hint{background:var(--yellow-l);border-left:4px solid var(--yellow);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev:before{content:"";position:absolute;left:-21px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--blue)}
.tl .ev.done:before{background:var(--blue)}
.steps{display:flex;gap:4px;margin:6px 0 2px}
.steps span{flex:1;height:6px;border-radius:99px;background:#E5E7EB}
.steps span.on{background:var(--blue)}
.steps span.end{background:var(--ok)}
/* nav */
nav.tabs{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 2px;cursor:pointer;position:relative}
nav.tabs button.on{color:var(--blue);font-weight:650}
nav.tabs button.on svg{stroke:var(--blue)}
nav.tabs .pill{position:absolute;top:2px;right:calc(50% - 20px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.fab{position:absolute;right:16px;bottom:84px;width:56px;height:56px;border-radius:18px;background:var(--yellow);border:0;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18);cursor:pointer;z-index:6}
/* toast */
#toast{position:absolute;left:16px;right:16px;bottom:92px;background:#111827;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:none}
/* sheet */
#sheet{position:absolute;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;z-index:30}
#sheet.open{display:flex}
#sheet .pane{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:10px 16px 24px;max-height:85%;overflow-y:auto}
#sheet .grab{width:40px;height:5px;border-radius:99px;background:#D1D5DB;margin:4px auto 12px}
/* login */
.login{flex:1;overflow-y:auto;background:linear-gradient(180deg,var(--blue) 0,var(--blue-d) 230px,var(--bg) 230px);padding:28px 16px 32px}
.brand{color:#fff;display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;font-weight:900;color:var(--blue);font-size:20px;letter-spacing:-1px}
.brand h2{margin:0;font-size:22px}
.brand p{margin:2px 0 0;opacity:.85;font-size:13px}
.login .intro{color:#fff;opacity:.92;font-size:14px;margin:18px 2px 18px}
.rolecard{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(16,24,40,.08);cursor:pointer;border:2px solid transparent}
.rolecard:active{border-color:var(--blue)}
.rolecard .ico{background:var(--blue-l)}
.tag{font-size:10.5px;font-weight:700;color:var(--blue);background:var(--blue-l);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:middle}
.tag.y{color:#7A5B00;background:var(--yellow-l)}
.disc{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.qr{display:block;margin:8px auto;border:8px solid #fff;border-radius:10px;box-shadow:0 0 0 1px var(--line)}
.scan{height:200px;border-radius:16px;background:#0F172A;position:relative;overflow:hidden;display:grid;place-items:center;color:#94A3B8;font-size:13px}
.scan:before{content:"";position:absolute;width:150px;height:150px;border:3px solid var(--yellow);border-radius:14px}
.scan:after{content:"";position:absolute;left:20%;right:20%;height:2px;background:var(--yellow);top:30%;animation:sc 2s infinite ease-in-out}
@keyframes sc{50%{top:70%}}
.net{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.net.off{background:var(--mid-l);color:#7A5B00}.net.on{background:var(--ok-l);color:var(--ok)}
.switch{width:44px;height:26px;border-radius:99px;background:#D1D5DB;position:relative;border:0;cursor:pointer;flex-shrink:0}
.switch:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--blue)}.switch.on:after{left:21px}
.hbars .hb{margin-bottom:10px}
.hbars .hb .row{font-size:13px;margin-bottom:4px}
.pub{background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.pub{border-bottom:6px solid var(--yellow)}
.pub .big{font-size:30px;font-weight:800}
.pubgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;position:relative;z-index:1}
.pubgrid div{background:rgba(255,255,255,.12);border-radius:12px;padding:10px}
.pubgrid b{font-size:22px;display:block}
.pubgrid span{font-size:12px;opacity:.85}
</style>
</head>

  voluntario:[['home','Inicio','home'],['acts','Actividades','cal'],['tasks','Tareas','check'],['coms','Avisos','mega'],['profile','Perfil','user']],

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini = n => n.split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const pct = (a,b) => Math.round(a*100/Math.max(b,1));
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2300); }
function sheet(html){ $('#sheetBody').innerHTML=html; $('#sheet').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); }
$('#sheet').addEventListener('click', e => { if(e.target.id==='sheet') closeSheet(); });

function go(route, param=null, push=true){
  if(push && S.route) S.stack.push([S.route, S.param]);
  S.route=route; S.param=param; S.q=''; render();
  const m=document.querySelector('main'); if(m) m.scrollTop=0;
}
function tab(route){ S.stack=[]; S.route=route; S.param=null; S.filter='Todos'; S.q=''; render(); }
function back(){ const p=S.stack.pop(); if(p){ S.route=p[0]; S.param=p[1]; render(); } }
function home(){ return S.role==='asistente' ? 'cases' : 'home'; }

function stackBar(o){ const t=o.ok+o.mid+o.bad;
  return `<div class="bar"><span class="s-ok" style="width:${pct(o.ok,t)}%"></span><span class="s-mid" style="width:${pct(o.mid,t)}%"></span><span class="s-bad" style="width:${pct(o.bad,t)}%"></span></div>`; }
function progBar(v, color){ return `<div class="bar"><span class="f" style="width:${v}%;${color?'background:'+color:''}"></span></div>`; }
const legend = `<div class="row meta" style="gap:14px;flex-wrap:wrap;margin:4px 2px 10px">
  <span class="row" style="gap:6px"><i class="dot d-ok"></i>Comité armado</span>
  <span class="row" style="gap:6px"><i class="dot d-mid"></i>Coordinador sin equipo</span>
  <span class="row" style="gap:6px"><i class="dot d-bad"></i>Sin presencia</span></div>`;
const stBadge = st => st==='ok'?'<span class="badge b-ok">Comité armado</span>':st==='mid'?'<span class="badge b-mid">Sin equipo</span>':'<span class="badge b-bad">Sin presencia</span>';
function caseState(c){ return c.st>=4 ? c.end : STATES[c.st]; }
function caseBadge(c){ const s=caseState(c);
  const cls = s==='Resuelto'?'b-ok':s==='No procede'||s==='Cerrado sin respuesta'?'b-grey':s==='Recibido'?'b-yel':'b-blue';
  return `<span class="badge ${cls}">${s}</span>`; }
const prioBadge = p => `<span class="badge ${p==='Alta'?'b-bad':p==='Media'?'b-mid':'b-grey'}">${p}</span>`;
const unread = () => S.coms.filter(c=>!c.read).length;

/* ---------- Layout ---------- */
function render(){
  const app=$('#app');
  if(!S.role){ app.innerHTML=loginView(); return; }
  const v = VIEWS[S.route] ? VIEWS[S.route](S.param) : {title:'', body:'<div class="empty">Pantalla no encontrada</div>'};
  const r = ROLES[S.role];
  const nav = NAV[S.role];
  const active = (nav.find(n=>n[0]===S.route) || nav.find(n=>n[0]===(v.tab||'')) || [])[0];
  app.innerHTML = `
    <header class="hdr">
      <div class="hdr-top">
        ${S.stack.length ? `<button class="back" onclick="back()" aria-label="Atrás">${ic('back',20,'#fff',2.2)}</button>`:''}
        <h1>${v.title}</h1>
        <button class="role-chip" onclick="roleSheet()"><i></i>${r.label.split(' ')[0]} ${ic('swap',14,'#fff',2)}</button>
      </div>
      ${v.sub ? `<div class="sub">${v.sub}</div>`:''}
    </header>
    <main>${v.body}</main>
    ${v.fab||''}
    <nav class="tabs">${nav.map(n=>`<button class="${n[0]===active?'on':''}" onclick="tab('${n[0]}')">
      ${n[0]==='coms'&&unread()?`<span class="pill">${unread()}</span>`:''}${ic(n[2],22,n[0]===active?'#1E4FA0':'#6B7280')}<span>${n[1]}</span></button>`).join('')}</nav>`;
}

function loginView(){
  return `<div class="login">
    <div class="brand"><div class="logo">V</div><div><h2>Plataforma Vamos</h2><p>Mock navegable · app móvil</p></div></div>
    <p class="intro">Elige con qué rol quieres entrar. Cada rol ve una app distinta según su función y su territorio.</p>
    ${Object.entries(ROLES).map(([k,r])=>`
      <div class="rolecard" onclick="login('${k}')">
        <div class="ico">${ic(r.icon,22,'#1E4FA0')}</div>
        <div class="grow"><div class="title">${r.label}<span class="tag ${r.tagY?'y':''}">${r.tag}</span></div>
          <div class="meta">${r.name} · ${r.place}</div>
          <div class="meta" style="margin-top:2px">${r.desc}</div></div>
        ${ic('chev',18,'#9CA3AF')}
      </div>`).join('')}
    <p class="disc">Prototipo de demostración. Nombres y cifras son ficticios.</p>
  </div>`;
}
function login(k){ S.role=k; S.stack=[]; S.route=home(); S.param=null; render(); toast('Entraste como '+ROLES[k].label); }
function roleSheet(){
  sheet(`<div class="title" style="font-size:17px;margin-bottom:4px">Cambiar de rol</div>
    <div class="meta" style="margin-bottom:12px">Solo existe en el mock para mostrar todas las vistas.</div>
    ${Object.entries(ROLES).map(([k,r])=>`<div class="li tap row" style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="closeSheet();login('${k}')">
      <div class="ico" style="background:${k===S.role?'var(--blue)':'var(--blue-l)'}">${ic(r.icon,20,k===S.role?'#fff':'#1E4FA0')}</div>
      <div class="grow"><div class="title">${r.label}</div><div class="meta">${r.name}</div></div>
      ${k===S.role?'<span class="badge b-blue">Actual</span>':''}</div>`).join('')}
    <div class="btns"><button class="btn btn-g" onclick="closeSheet();S.role=null;render()">${ic('logout',18)} Volver a la pantalla inicial</button></div>`);
}

/* ---------- Componentes compartidos ---------- */
function actCard(a){
  return `<div class="card tap" onclick="go('act','${a.id}')">
    <div class="row" style="align-items:flex-start">
      <div class="ico" style="background:var(--yellow-l);flex-direction:column;line-height:1.05;text-align:center;width:50px;height:54px">
        <b style="font-size:17px;color:var(--ink)">${a.date.split(' ')[1]}</b><span style="font-size:11px;color:#7A5B00">${a.date.split(' ')[2]}</span></div>
      <div class="grow"><span class="badge b-blue">${a.type}</span>
        <div class="title" style="margin-top:4px">${a.title}</div>
        <div class="meta ell">${a.time} · ${a.place}</div></div>
    </div>
    <div class="row" style="margin-top:10px"><div class="grow">${progBar(pct(a.ins,a.cap))}</div><span class="meta">${a.ins}/${a.cap}</span>
      ${a.me?'<span class="badge b-ok">Inscrito</span>':''}</div>
  </div>`;
}
function comCard(c){
  return `<div class="card tap" onclick="go('com','${c.id}')">
    <div class="row"><div class="ico" style="background:${c.read?'#EEF0F3':'var(--blue-l)'}">${ic('mega',20,c.read?'#6B7280':'#1E4FA0')}</div>
    <div class="grow"><div class="title ell" style="${c.read?'font-weight:500':''}">${c.title}</div><div class="meta ell">${c.from} · ${c.date}</div></div>
    ${!c.read?'<i class="dot" style="background:var(--blue)"></i>':''}</div></div>`;
}
function caseCard(c){
  return `<div class="card tap" onclick="go('case','${c.id}')">
    <div class="row" style="align-items:flex-start">
      <div class="ico" style="background:${CAT_COLOR[c.cat]}1A">${ic('folder',20,CAT_COLOR[c.cat])}</div>
      <div class="grow"><div class="row" style="gap:6px"><span class="meta" style="font-weight:600">${c.id}</span>${c.fav?ic('star',14,'#F5C400',2.2):''}</div>
        <div class="title ell">${c.cat} · ${c.desc}</div>
        <div class="meta ell">${c.comm} · ${c.inst||'Sin derivar'} · ${c.days} d</div></div>
    </div>
    <div class="row" style="margin-top:8px;gap:6px">${caseBadge(c)}${prioBadge(c.prio)}<span class="badge b-grey">${c.ch}</span></div>
  </div>`;
}
function missionCard(m, key){
  const v = key==='nac'?m.prog.nac : key==='prov'?m.prog.prov.Chiriquí : key==='circ'?m.prog.circ['4-1'] : m.prog.nac;
  return `<div class="card tap" onclick="go('mission','${m.id}')">
    <div class="row"><div class="ico" style="background:var(--blue-l)">${ic('target',20,'#1E4FA0')}</div>
      <div class="grow"><div class="title">${m.title}</div><div class="meta">${m.goal}</div></div></div>
    <div class="row" style="margin-top:10px"><div class="grow">${progBar(v)}</div><b style="font-size:13px">${v}%</b></div>
    <div class="meta" style="margin-top:6px">Vence ${fmtDate(m.due)} · ${m.from}</div></div>`;
}
function fmtDate(d){ const [y,m,dd]=d.split('-'); return `${+dd} ${['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]} ${y}`; }
function kpi(v,l,acc){ return `<div class="kpi ${acc?'accent':''}"><b>${v}</b><span>${l}</span></div>`; }
function search(ph, onIn){ return `<div class="search">${ic('search',18,'#9CA3AF')}<input class="inp" placeholder="${ph}" value="${esc(S.q)}" oninput="S.q=this.value;${onIn}"></div>`; }

/* ---------- Pantallas ---------- */
const VIEWS = {};

/* INICIO por rol */
VIEWS.home = () => {
  const r=ROLES[S.role];
  if(S.role==='voluntario') return homeVol(r);
  if(S.role==='circuito') return homeCirc(r);
  if(S.role==='provincial') return homeProv(r);
  if(S.role==='direccion') return homeDir(r);
  if(S.role==='candidato') return homeCand(r);
  return {title:'Inicio', body:''};
};

function homeVol(r){
  const pend=S.tasks.filter(t=>!t.done);
  const mine=S.acts.filter(a=>a.me);
  return {title:`Hola, ${r.name.split(' ')[0]}`, sub:r.place, body:`
    <div class="kpis">${kpi(pend.length,'Tareas pendientes',true)}${kpi(mine.length,'Actividades inscritas')}</div>
    <div class="sec">Mis tareas <a onclick="tab('tasks')">Ver todas</a></div>
    ${pend.length?pend.map(taskRow).join(''):'<div class="card empty">No tienes tareas pendientes.</div>'}
    <div class="sec">Próxima actividad <a onclick="tab('acts')">Ver todas</a></div>
    ${actCard(mine[0]||S.acts[0])}
    <div class="sec">Comunicados <a onclick="tab('coms')">Ver todos</a></div>
    ${S.coms.slice(0,2).map(comCard).join('')}`};
}
function taskRow(t){
  const m=S.missions.find(x=>x.id===t.mid);
  return `<div class="card row" style="align-items:flex-start">
    <button onclick="toggleTask('${t.id}')" aria-label="Marcar tarea" style="width:26px;height:26px;border-radius:8px;border:2px solid ${t.done?'var(--ok)':'#CBD5E1'};background:${t.done?'var(--ok)':'#fff'};display:grid;place-items:center;cursor:pointer;flex-shrink:0;margin-top:2px">${t.done?ic('check',16,'#fff',3):''}</button>
    <div class="grow"><div class="title" style="${t.done?'text-decoration:line-through;color:var(--muted)':''}">${t.text}</div><div class="meta">Misión: ${m?m.title:''}</div></div></div>`;
}
function toggleTask(id){ const t=S.tasks.find(x=>x.id===id); t.done=!t.done; render(); toast(t.done?'Tarea completada. Tu coordinador ya lo ve.':'Tarea marcada como pendiente'); }

function homeCirc(r){
  const ok=CORREG.filter(c=>c.st==='ok').length, vol=CORREG.reduce((a,c)=>a+c.vol,0);
  return {title:'Circuito 4-1 · David', sub:`${r.name} · Coordinadora`, body:`
    <div class="kpis">${kpi(vol,'Voluntarios',true)}${kpi(`${ok}/${CORREG.length}`,'Corregimientos con comité')}${kpi(S.pending.length,'Por aprobar')}${kpi(S.acts.length,'Actividades próximas')}</div>
    ${S.pending.length?`<div class="hint">Tienes <b>${S.pending.length}</b> voluntarios nuevos esperando aprobación. <a style="color:var(--blue);font-weight:600;cursor:pointer" onclick="tab('team')">Revisar</a></div>`:''}
    <div class="sec">Cobertura del circuito</div>
    <div class="card">${legend}${corrList(true)}</div>
    <div class="sec">Misiones activas <a onclick="tab('missions')">Ver todas</a></div>
    ${S.missions.slice(0,2).map(m=>missionCard(m,'circ')).join('')}`};
}
function corrList(compact){
  return `<div class="list">${CORREG.map(c=>`<div class="li"><i class="dot d-${c.st}"></i>
    <div class="grow"><div class="title" style="font-size:14px">${c.name}</div><div class="meta">${c.coord==='—'?'Sin coordinador':c.coord}${compact?'':' · coordinador'}</div></div>

    ${full?`<div class="card">${legend}${corrList(false)}</div>`:`<div class="card empty">En el mock solo está cargado el detalle del Circuito 4-1 · David.</div><div class="btns"><button class="btn btn-o" onclick="go('circuit','4-1')">Ver Circuito 4-1</button></div>`}`};
};

/* DESPACHO (candidata) */
VIEWS.despacho = () => {
  const open=S.cases.filter(c=>c.st<4), res=S.cases.filter(c=>c.end==='Resuelto');
  const cats={}; S.cases.forEach(c=>cats[c.cat]=(cats[c.cat]||0)+1);
  const slow=[['MINSA',34],['MOP',18],['IDAAN',12],['Municipio de David',9]];
  return {title:'Despacho ciudadano', sub:'Casos del Circuito 4-1', body:`
    <div class="kpis">${kpi(open.length,'Casos abiertos',true)}${kpi(res.length,'Resueltos este mes')}${kpi('11 d','Tiempo medio de respuesta')}${kpi(open.filter(c=>c.days>14).length,'Casos estancados (+14 d)')}</div>
    <div class="sec">Temas más frecuentes</div>
    <div class="card hbars">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="hb"><div class="row"><span class="grow">${k}</span><b>${v}</b></div>${progBar(pct(v,S.cases.length), CAT_COLOR[k])}</div>`).join('')}</div>
    <div class="sec">Instituciones que más tardan</div>
    <div class="card hbars">${slow.map(([k,v])=>`<div class="hb"><div class="row"><span class="grow">${k}</span><b>${v} días</b></div>${progBar(pct(v,34), v>20?'#E57373':'#F5C400')}</div>`).join('')}
      <div class="meta">Dato útil para fiscalizar desde el pleno.</div></div>
    <div class="sec">Casos priorizados <a onclick="go('cases')">Ver todos</a></div>
    ${S.cases.filter(c=>c.fav||c.prio==='Alta').filter(c=>c.st<4).map(caseCard).join('')}`};
};

/* CASOS */
VIEWS.cases = () => {
  const F=['Todos','Abiertos','Recibido','Derivado','En seguimiento','Cerrados'];
  const match = c => S.filter==='Todos' || (S.filter==='Abiertos'&&c.st<4) || (S.filter==='Cerrados'&&c.st>=4) || caseState(c)===S.filter;
  const list=S.cases.filter(match).filter(c=>(c.id+c.desc+c.comm+c.cat+c.name).toLowerCase().includes(S.q.toLowerCase()));
  return {title:'Casos', tab:S.role==='candidato'?'despacho':'cases', sub:`${S.cases.filter(c=>c.st<4).length} abiertos · ${S.cases.length} en total`, body:`
    ${search('Buscar caso, comunidad o persona',"renderCases()")}
    <div class="chips" style="margin:12px 0">${F.map(f=>`<button class="chip ${S.filter===f?'on':''}" onclick="S.filter='${f}';render()">${f}</button>`).join('')}</div>
    <div id="caseList">${list.map(caseCard).join('')||'<div class="empty">Sin casos</div>'}</div>`,
    fab: S.role==='asistente'?`<button class="fab" onclick="tab('caseNew')" aria-label="Nuevo caso">${ic('plus',26,'#1F2937',2.4)}</button>`:''};
};
function renderCases(){ const v=VIEWS.cases(); const tmp=document.createElement('div'); tmp.innerHTML=v.body; $('#caseList').innerHTML=tmp.querySelector('#caseList').innerHTML; }
VIEWS.case = id => {
  const c=S.cases.find(x=>x.id===id);
  const asis = S.role==='asistente', closed=c.st>=4;
  const stepHtml = STATES.map((s,i)=>`<span class="${closed&&c.end==='Resuelto'?'end':i<=c.st?'on':''}"></span>`).join('') + `<span class="${closed?(c.end==='Resuelto'?'end':'on'):''}"></span>`;
  return {title:c.id, tab:S.role==='candidato'?'despacho':'cases', body:`
    <div class="card"><div class="row" style="gap:6px;flex-wrap:wrap">${caseBadge(c)}${prioBadge(c.prio)}<span class="badge b-grey">${c.cat}</span>${c.fav?'<span class="badge b-yel">★ Priorizado</span>':''}</div>
      <div class="title" style="font-size:17px;margin:10px 0 4px">${c.desc}</div>
      <div class="steps">${stepHtml}</div><div class="meta">Recibido → En análisis → Derivado → En seguimiento → Cierre</div></div>
    <div class="card list">
      <div class="li">${ic('user',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">${c.name}</div><div class="meta">Ciudadano · entró por ${c.ch}</div></div></div>
      <div class="li">${ic('pin',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">${c.comm}</div><div class="meta">Comunidad</div></div></div>
      <div class="li">${ic('doc',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">${c.inst||'Aún sin derivar'}</div><div class="meta">Institución responsable</div></div></div>
      <div class="li">${ic('clock',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">${c.days} ${c.days===1?'día':'días'} abierto</div><div class="meta">${c.days>14&&!closed?'<span style="color:var(--bad)">Estancado: requiere seguimiento</span>':'Dentro del plazo'}</div></div></div>
    </div>
    <div class="sec">Historial</div>
    <div class="card"><div class="tl">${c.hist.map((h,i)=>`<div class="ev ${i<c.hist.length-1||closed?'done':''}"><div class="title" style="font-size:14px">${h[0]} <span class="meta" style="font-weight:400">· ${h[1]}</span></div>${h[2]?`<div class="meta">${h[2]}</div>`:''}</div>`).join('')}</div></div>
    ${asis && !closed ? `<div class="btns">
        ${c.st<2?`<button class="btn btn-p" onclick="deriveSheet('${c.id}')">Derivar a institución</button>`:''}
        ${c.st===0?`<button class="btn btn-o" onclick="advance('${c.id}')">Pasar a análisis</button>`:''}
        ${c.st===2?`<button class="btn btn-p" onclick="advance('${c.id}')">Registrar respuesta y dar seguimiento</button>`:''}
        ${c.st===3?`<button class="btn btn-p" onclick="closeCase('${c.id}','Resuelto')">${ic('check',18,'#fff',2.5)} Marcar como resuelto</button>`:''}
        <div class="btns two" style="margin:0"><button class="btn btn-o" onclick="closeCase('${c.id}','${c.st===3?'Cerrado sin respuesta':'No procede'}')">${c.st===3?'Cerrar sin respuesta':'No procede'}</button>
        <button class="btn btn-o" onclick="toast('Mensaje enviado al ciudadano con el estado del caso')">Notificar</button></div></div>`:''}
    ${S.role==='candidato'?`<div class="btns"><button class="btn ${c.fav?'btn-g':'btn-y'}" onclick="fav('${c.id}')">${c.fav?'Quitar prioridad':'★ Priorizar este caso'}</button></div>`:''}`};
};
function deriveSheet(id){
  sheet(`<div class="title" style="font-size:17px">Derivar caso</div><div class="meta" style="margin-bottom:10px">Elige la institución que corresponde</div>
    <div class="wrapchips" id="dinst">${INSTS.map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="pick(this,'dinst')">${x}</button>`).join('')}</div>
    <label class="f">N.º de nota u oficio</label><input class="inp" id="dnote" value="Nota 131-2026">
    <label class="f">Fecha de seguimiento</label><input class="inp" type="date" value="2026-10-21">
    <div class="btns"><button class="btn btn-p" onclick="derive('${id}')">Derivar y avisar al ciudadano</button></div>`);
}
function derive(id){ const c=S.cases.find(x=>x.id===id); c.inst=picked('dinst'); const note=$('#dnote').value;
  if(c.st<1) c.hist.push(['En análisis','Hoy','']); c.st=2; c.hist.push(['Derivado','Hoy',`${note} enviada a ${c.inst}`]); closeSheet(); render(); toast('Caso derivado a '+c.inst+'. El ciudadano recibió aviso.'); }
function advance(id){ const c=S.cases.find(x=>x.id===id); c.st++; c.hist.push([STATES[c.st],'Hoy',c.st===3?'Respuesta de la institución registrada':'']); render(); toast('Estado actualizado: '+STATES[c.st]); }
function closeCase(id, end){ const c=S.cases.find(x=>x.id===id); c.st=4; c.end=end; c.hist.push([end,'Hoy','']); render(); toast('Caso cerrado: '+end+'. Se avisó al ciudadano.'); }
function fav(id){ const c=S.cases.find(x=>x.id===id); c.fav=!c.fav; render(); toast(c.fav?'Caso priorizado; el despacho lo verá arriba':'Prioridad retirada'); }

VIEWS.caseNew = () => ({title:'Nuevo caso', sub:'Registro en menos de un minuto', body:`
  <label class="f">¿Por dónde llegó?</label><div class="chips" id="nch">${['WhatsApp','Llamada','Visita','Gira'].map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="pick(this,'nch')">${x}</button>`).join('')}</div>
  <label class="f">Nombre del ciudadano o grupo</label><input class="inp" id="nname" placeholder="Ej. Vecinos de Calle 8">
  <label class="f">Teléfono para avisarle</label><input class="inp" id="ntel" placeholder="6000-0000" inputmode="tel">
  <label class="f">Comunidad</label><select class="inp" id="ncomm">${CORREG.map(c=>`<option>${c.name}</option>`).join('')}</select>
  <label class="f">Categoría</label><div class="wrapchips" id="ncat">${CATS.map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="pick(this,'ncat')">${x}</button>`).join('')}</div>
  <label class="f">Prioridad</label><div class="chips" id="nprio">${['Alta','Media','Baja'].map((x,i)=>`<button class="chip ${i===1?'on':''}" onclick="pick(this,'nprio')">${x}</button>`).join('')}</div>
  <label class="f">¿Qué pasa?</label><textarea class="inp" id="ndesc" placeholder="Describe el problema en pocas palabras"></textarea>
  <div class="btns"><button class="btn btn-g" onclick="toast('Cámara abierta para adjuntar foto (simulado)')">Adjuntar foto</button>
  <button class="btn btn-p" onclick="saveCase()">Registrar caso</button></div>`});
function saveCase(){
  const d=$('#ndesc').value.trim(); if(!d){ toast('Describe brevemente el caso'); return; }
  const num='DC-2026-0'+(154+S.cases.length-7);
  S.cases.unshift({id:num, cat:picked('ncat'), name:$('#nname').value||'Ciudadano', comm:$('#ncomm').value, ch:picked('nch'), st:0, prio:picked('nprio'), inst:'', days:0, desc:d, hist:[['Recibido','Hoy','Registrado por '+ROLES[S.role].name]]});
  S.stack=[]; S.route='cases'; go('case', num, true); toast('Caso '+num+' creado. Se envió confirmación al ciudadano.');
}

/* GIRAS */
VIEWS.giras = () => ({title:'Giras comunitarias', sub:'Circuito 4-1 · David', body:`
  ${S.giras.map(g=>`<div class="card tap" onclick="go('gira','${g.id}')"><div class="row">
    <div class="ico" style="background:${g.status==='Próxima'?'var(--yellow-l)':'var(--blue-l)'}">${ic('bus',20,g.status==='Próxima'?'#7A5B00':'#1E4FA0')}</div>
    <div class="grow"><div class="title">Gira a ${g.comm}</div><div class="meta">${g.date} · ${g.time}</div></div>
    <span class="badge ${g.status==='Próxima'?'b-yel':'b-ok'}">${g.status}</span></div>
    ${g.status==='Realizada'?`<div class="meta" style="margin-top:8px">${g.att} asistentes · ${g.cases} casos levantados</div>`:''}</div>`).join('')}`,
  fab: S.role==='asistente'||S.role==='candidato' ? `<button class="fab" onclick="toast('Nueva gira: elige comunidad, fecha y agenda (simulado)')" aria-label="Nueva gira">${ic('plus',26,'#1F2937',2.4)}</button>`:''});
VIEWS.gira = id => {
  const g=S.giras.find(x=>x.id===id);
  return {title:'Gira a '+g.comm, tab:'giras', sub:`${g.date} · ${g.time}`, body:`
    <div class="sec">Agenda</div>
    <div class="card"><div class="tl">${g.agenda.map(a=>`<div class="ev ${g.status==='Realizada'?'done':''}"><div style="font-size:14px">${a}</div></div>`).join('')}</div></div>
    ${g.status==='Realizada'?`<div class="sec">Resumen</div><div class="kpis">${kpi(g.att,'Asistentes',true)}${kpi(g.cases,'Casos levantados')}</div>
      <div class="sec">Casos de esta gira</div>${S.cases.filter(c=>c.comm===g.comm).map(caseCard).join('')||'<div class="card empty">Los casos ya se cerraron.</div>'}`
    :`<div class="hint">En gira puedes registrar casos aunque no haya señal; se guardan y se envían al volver a tener conexión.</div>
      <div class="btns"><button class="btn btn-y" onclick="go('giraMode','${g.id}')">${ic('bus',20,'#1F2937')} Iniciar modo gira</button></div>`}`};
};
VIEWS.giraMode = id => {
  const g=S.giras.find(x=>x.id===id);
  return {title:'Modo gira', tab:'giras', sub:`${g.comm} · ${S.giraSaved} casos registrados`, body:`
    <div class="net ${S.online?'on':'off'}">${ic('wifi',18)}<span class="grow">${S.online?'Con conexión':'Sin señal: los casos se guardan en el teléfono'}</span>
      <button class="switch ${S.online?'on':''}" onclick="S.online=!S.online;render()" aria-label="Simular conexión"></button></div>
    <div class="card">
      <label class="f" style="margin-top:0">Categoría</label><div class="wrapchips" id="gcat">${CATS.map((x,i)=>`<button class="chip ${i===0?'on':''}" onclick="pick(this,'gcat')">${x}</button>`).join('')}</div>
      <label class="f">Nombre y teléfono</label><input class="inp" id="gname" placeholder="Ej. Doña Carmen · 6123-4567">
      <label class="f">¿Qué pasa?</label><textarea class="inp" id="gdesc" style="min-height:70px" placeholder="Describe rápido el caso"></textarea>
      <div class="btns two"><button class="btn btn-g" onclick="toast('Foto adjuntada (simulado)')">Foto</button><button class="btn btn-p" onclick="saveGira('${id}')">Guardar caso</button></div>
    </div>
    <div class="btns"><button class="btn btn-o" onclick="endGira('${id}')">Terminar gira</button></div>`};
};
function saveGira(id){
  const d=$('#gdesc').value.trim(); if(!d){ toast('Describe brevemente el caso'); return; }
  const g=S.giras.find(x=>x.id===id); S.giraSaved++;
  if(S.online){ const num='DC-2026-0'+(154+S.cases.length-7); S.cases.unshift({id:num,cat:picked('gcat'),name:$('#gname').value||'Ciudadano',comm:g.comm,ch:'Gira',st:0,prio:'Media',inst:'',days:0,desc:d,hist:[['Recibido','Hoy','Levantado en gira']]}); }
  render(); toast(S.online?'Caso guardado y enviado al despacho':'Caso guardado en el teléfono. Se enviará al recuperar señal.');
}
function endGira(id){ const g=S.giras.find(x=>x.id===id); g.status='Realizada'; g.att=27; g.cases=S.giraSaved; S.giraSaved=0; S.online=true; S.stack=[]; S.route='giras'; render(); toast('Gira cerrada. Resumen listo para el diputado.'); }

/* RENDICIÓN DE CUENTAS */
VIEWS.rendicion = () => ({title:'Rendición de cuentas', sub:'Vista previa de la página pública', body:`
  <div class="pub"><div style="position:relative;z-index:1"><div style="font-size:13px;opacity:.85">Diputada · Circuito 4-1 · David</div>
    <div class="big">${ROLES.candidato.name}</div><div style="font-size:13px;opacity:.85">Periodo 2024-2029 · Datos al 7 de octubre de 2026</div></div>
    <div class="pubgrid"><div><b>6</b><span>Proyectos de ley presentados</span></div><div><b>97%</b><span>Asistencia a votaciones</span></div>
    <div><b>18</b><span>Giras comunitarias</span></div><div><b>236</b><span>Casos atendidos · 61% resueltos</span></div></div></div>
  <div class="sec">Proyectos recientes</div>
  <div class="card list">
    <div class="li">${ic('doc',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">Ley de transparencia en planillas públicas</div><div class="meta">En primer debate</div></div></div>
    <div class="li">${ic('doc',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">Acueductos rurales de Chiriquí</div><div class="meta">Prohijado</div></div></div>
    <div class="li">${ic('doc',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">Rendición de cuentas de partidas circuitales</div><div class="meta">Presentado</div></div></div></div>
  <div class="hint">La página pública solo muestra números agregados. Nunca aparecen nombres de ciudadanos atendidos.</div>
  <div class="btns two"><button class="btn btn-o" onclick="toast('Enlace copiado para compartir en redes')">${ic('share',18)} Compartir</button><button class="btn btn-p" onclick="toast('Cambios aprobados y publicados')">Aprobar y publicar</button></div>`});

/* PERFIL */
VIEWS.profile = () => {
  const r=ROLES[S.role];
  const vol = S.role==='voluntario';
  return {title:'Perfil', body:`
    <div class="card row"><div class="avatar" style="width:56px;height:56px;font-size:18px">${ini(r.name)}</div>
      <div class="grow"><div class="title" style="font-size:17px">${r.name}</div><div class="meta">${r.label}</div><div class="meta">${r.place}</div></div></div>
    ${vol?`<div class="sec">Mi QR de asistencia</div><div class="card" style="text-align:center">${qrSvg()}<div class="meta">Muéstralo en cada actividad para registrar tu asistencia.</div></div>
      <div class="sec">Mis habilidades</div><div class="card wrapchips"><span class="badge b-blue">Logística</span><span class="badge b-blue">Transporte</span><span class="badge b-grey">Fines de semana</span></div>
      <div class="sec">Mi participación</div><div class="kpis">${kpi(7,'Actividades',true)}${kpi(S.tasks.filter(t=>t.done).length,'Tareas completadas')}</div>`:''}
    <div class="sec">Seguridad y datos</div>
    <div class="card list">
      <div class="li">${ic('shield',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">Ves solo tu territorio</div><div class="meta">Permisos por rol: ${r.place}</div></div></div>
      <div class="li">${ic('doc',20,'#1E4FA0')}<div class="grow"><div class="title" style="font-size:14px">Mis datos y consentimiento</div><div class="meta">Puedes pedir tu baja en cualquier momento</div></div></div>
    </div>
    <div class="btns"><button class="btn btn-o" onclick="roleSheet()">${ic('swap',18)} Cambiar de rol (solo mock)</button>
      <button class="btn btn-g" onclick="S.role=null;render()">${ic('logout',18)} Cerrar sesión</button></div>`};
};
function qrSvg(){
  let s=''; const n=21, c=6; let seed=7;
  const rnd=()=>{ seed=(seed*9301+49297)%233280; return seed/233280; };
  const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#111"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#111"/>`;
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const inF=(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12); if(!inF && rnd()>.52) s+=`<rect x="${x*c}" y="${y*c}" width="${c}" height="${c}" fill="#111"/>`; }
  return `<svg class="qr" width="${n*c}" height="${n*c}" viewBox="0 0 ${n*c} ${n*c}"><rect width="100%" height="100%" fill="#fff"/>${s}${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`;
}

render();
</script>
